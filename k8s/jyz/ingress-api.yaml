apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jyz-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt-http
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jyz-api.xiaofengyu.com
      secretName: jyz-api-tls
  rules:
    - host: jyz-api.xiaofengyu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jyz-api
                port:
                  number: 80
