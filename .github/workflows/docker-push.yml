name: Build and Push Docker Image

on:
  push:
    tags:
      - "api-*.*.*"
      - "web-*.*.*"

jobs:
  build-and-push-api:
    if: startsWith(github.ref_name, 'api-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#api-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/api/Jyz
          file: ./src/api/Jyz/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jyz-api:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jyz-api:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --list 'api-*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}\$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$PREV_TAG"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-and-push-web:
    if: startsWith(github.ref_name, 'web-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#web-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/web
          file: ./src/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jyz-web:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jyz-web:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --list 'web-*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}\$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$PREV_TAG"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
